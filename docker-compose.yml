version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: legacy-lens-db
    restart: always
    environment:
      POSTGRES_DB: legacylens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legacy_lens_pgdata:/var/lib/postgresql/data

volumes:
  legacy_lens_pgdata:
