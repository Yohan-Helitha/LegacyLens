# Test-only overrides for @DataJpaTest classes. Test resources take priority
# over src/main/resources on the classpath, so these override the Postgres-
# specific settings in the main application.properties. @DataJpaTest swaps in
# an embedded H2 DataSource automatically (@AutoConfigureTestDatabase); this
# just makes Hibernate speak H2's dialect and build the schema fresh each run.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
