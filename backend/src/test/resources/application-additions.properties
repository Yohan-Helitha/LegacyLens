# ─────────────────────────────────────────────────────────────────────────────
# ADD THESE LINES to your existing application.properties (or application.yml
# in the equivalent yaml form). They are new — nothing here replaces what
# you already have.
# ─────────────────────────────────────────────────────────────────────────────

# ── OTP ──────────────────────────────────────────────────────────────────
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ── Auth / PIN lockout ──────────────────────────────────────────────────
app.auth.max-failed-pin-attempts=5

# NOTE on app.jwt.secret / app.jwt.expiration-ms:
# You already have these two in application.properties — no change needed.
# Just make sure app.jwt.secret in application-local.properties is at least
# 32 characters long (HS256 requires a 256-bit key) or JwtService will throw
# a WeakKeyException at startup.
