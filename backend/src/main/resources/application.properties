# ─────────────────────────────────────────────────────────────────────────────
# LegacyLens Spring Boot — Application Properties
# ─────────────────────────────────────────────────────────────────────────────

# Server
server.port=8081

# ── Supabase PostgreSQL (Direct Connection) ────────────────────────────────
spring.datasource.url=jdbc:postgresql://db.ijtmikcskmjxubyeqrfa.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── CORS (allow Expo dev client) ───────────────────────────────────────────
app.cors.allowed-origins=http://localhost:19000,http://localhost:8081,exp://localhost:19000

# ── Load local secrets (gitignored) ───────────────────────────────────────
spring.config.import=optional:application-local.properties
