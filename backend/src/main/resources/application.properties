# ─────────────────────────────────────────────────────────────────────────────
# LegacyLens Spring Boot — Application Properties
# ─────────────────────────────────────────────────────────────────────────────

# Server
server.port=8081

# ── Supabase PostgreSQL (Direct Connection) ────────────────────────────────
# ── Supabase PostgreSQL (Session Pooler — IPv4, avoids the direct-connection
#    IPv6 SSL handshake failure some ISPs hit) ─────────────────────────────
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.ijtmikcskmjxubyeqrfa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── SMS Provider ────────────────────────────────────────────────────────────
# console = logs OTP to terminal (default, no setup needed)
# text-lk = sends real SMS via Text.lk
app.sms.provider=text-lk
app.sms.text-lk.api-key=${SMS_TEXTLK_API_KEY:}
app.sms.text-lk.sender-id=TextLKDemo


# ── CORS (allow Expo dev client) ───────────────────────────────────────────
app.cors.allowed-origins=http://localhost:19000,http://localhost:8081,http://localhost:4200,exp://localhost:19000

# ── File storage (dev only — local disk under the repo root; swap for
#    S3/Supabase Storage later, see FileStorageService) ─────────────────────
# Resolved relative to the backend module's working directory, so this lands
# at <repo-root>/uploads, a sibling of backend/ and mobile-app/, not inside
# backend/ itself. Used for both story media and creator verification proof
# files (FileStorageService enforces per-upload-type size/type limits, e.g.
# 10MB for proof documents, on top of the global cap below).
app.storage.upload-dir=../uploads

# ── Media storage (story media + hire-request voice notes only — see
#    MediaStorageService's doc comment for what this does and doesn't cover) ──
# local    = save under app.storage.upload-dir, served via /uploads/** (default)
# supabase = upload to Supabase Storage instead (the story-media bucket)
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:story-media}

# Spring Boot defaults to 1MB per file / 10MB per request, which a few
# seconds of recorded video already exceeds — raise both for story clips.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Speech-to-text (Azure fast transcription) ──────────────────────────────
# app.speech.active-provider is the only line that changes to switch
# providers — see SpeechToTextProvider's javadoc.
app.speech.active-provider=azure
app.speech.default-language=si-LK
app.speech.max-upload-bytes=5242880
app.speech.low-confidence-threshold=0.60
app.speech.azure.endpoint=${AZURE_SPEECH_ENDPOINT:}
app.speech.azure.key=${AZURE_SPEECH_KEY:}
app.speech.azure.region=${AZURE_SPEECH_REGION:}
app.speech.azure.api-version=2025-10-15
app.speech.azure.phrase-list-enabled=false

# ── Load local secrets (gitignored) ───────────────────────────────────────
spring.config.import=optional:.env,optional:application-local.properties

# ── Mapbox Configuration ───────────────────────────────────────────────────
app.mapbox.token=${MAPBOX_TOKEN:${EXPO_PUBLIC_MAPBOX_TOKEN:}}

# ── Swagger / OpenAPI Documentation ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha