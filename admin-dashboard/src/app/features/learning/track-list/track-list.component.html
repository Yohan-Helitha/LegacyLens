<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Learning Tracks</h2>
    <a routerLink="track/new" class="btn btn-primary">Add New Track</a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Region</th>
          <th>Difficulty</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let track of tracks">
          <td>{{ track.id }}</td>
          <td>{{ track.title }}</td>
          <td>{{ track.region || 'N/A' }}</td>
          <td>{{ track.difficultyLevel }}</td>
          <td>
            <a [routerLink]="['track', track.id, 'lessons']" class="btn btn-sm btn-info me-2 text-white">Manage Lessons</a>
            <a [routerLink]="['track', track.id, 'edit']" class="btn btn-sm btn-outline-primary">Edit</a>
          </td>
        </tr>
        <tr *ngIf="tracks.length === 0">
          <td colspan="5" class="text-center py-4 text-muted">No tracks found. Get started by creating one.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
