<div class="flex h-screen w-full overflow-hidden font-sans" style="background: var(--le-bg)">
  <app-learning-sidebar></app-learning-sidebar>

  <!-- Main Area -->
  <div class="flex-1 min-w-0 overflow-y-auto relative"
    style="scrollbar-width: thin; scrollbar-color: var(--le-border) transparent">

    <!-- Ambient background glows -->
    <div class="fixed top-[-200px] right-[-100px] w-[500px] h-[500px] pointer-events-none"
      style="background: radial-gradient(circle, rgba(16,185,129,0.05) 0%, transparent 70%); z-index: 0"></div>

    <!-- Sticky Top Nav -->
    <div class="le-nav-bar sticky top-0 z-50 flex items-center justify-between px-8 py-4">
      <div class="flex items-center gap-2 text-[12px] font-semibold" style="color: var(--le-text-secondary)">
        <a routerLink="/learning/tracks" class="hover:text-[var(--le-text-primary)] transition-colors">Learning
          Tracks</a>
        <span class="material-symbols-outlined text-[14px] text-[var(--le-text-muted)]">chevron_right</span>
        <span style="color: var(--le-text-primary)">{{ isEditMode ? 'Edit Track' : 'New Track' }}</span>
      </div>
      <div class="flex items-center gap-2">
        <a routerLink="/learning/tracks"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all hover:bg-[var(--le-surface-hover)]"
          style="border: 1px solid var(--le-border); color: var(--le-text-secondary)">
          <span class="material-symbols-outlined text-[14px]">arrow_back</span>
          Back to Tracks
        </a>
      </div>
    </div>

    <!-- Page Content -->
    <div class="le-page relative z-10">

      <!-- Header -->
      <div class="flex items-end justify-between mb-8">
        <div>
          <p class="text-[11px] font-bold uppercase tracking-widest mb-2 flex items-center gap-2"
            style="color: var(--le-accent)">
            <span class="material-symbols-outlined text-[14px]">
              {{ isEditMode ? 'edit_square' : 'add_circle' }}
            </span>
            Track Management
          </p>
          <h1 class="text-4xl font-black tracking-tight leading-none" style="color: var(--le-text-primary)">
            {{ isEditMode ? 'Edit' : 'Create' }} Learning Track
          </h1>
        </div>
      </div>

      <div class="max-w-3xl">
        <!-- Form Card -->
        <div class="glass-card">
          <div class="card-header border-b border-[var(--le-border)] pb-4 mb-5">
            <span class="material-symbols-outlined text-[20px]" style="color: var(--le-accent)">auto_stories</span>
            <h5 class="font-bold text-[15px]" style="color: var(--le-text-primary)">Track Details</h5>
          </div>

          <div class="card-body">
            <form [formGroup]="trackForm" (ngSubmit)="onSubmit()" class="space-y-5">

              <div class="form-group">
                <label class="form-label">Title <span class="text-red-400">*</span></label>
                <input type="text" class="form-control" formControlName="title"
                  placeholder="e.g. Fishing Village Dialect">
              </div>

              <div class="form-group flex-1">
                <label class="form-label">Description <span class="text-red-400">*</span></label>
                <textarea class="form-control" formControlName="description" rows="3"
                  placeholder="Describe what the learner will gain from this track..."></textarea>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Region</label>
                  <input type="text" class="form-control" formControlName="region" placeholder="e.g. Southern Province">
                </div>
                <div class="form-group">
                  <label class="form-label">Occupation Context</label>
                  <input type="text" class="form-control" formControlName="occupation" placeholder="e.g. Fisherman">
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Difficulty Level <span class="text-red-400">*</span></label>
                  <div class="select-wrapper">
                    <select class="form-control" formControlName="difficultyLevel">
                      <option value="BEGINNER">Beginner</option>
                      <option value="INTERMEDIATE">Intermediate</option>
                      <option value="ADVANCED">Advanced</option>
                    </select>
                    <span class="material-symbols-outlined select-icon">expand_more</span>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Thumbnail URL</label>
                  <input type="text" class="form-control" formControlName="thumbnailUrl" placeholder="https://...">
                </div>
              </div>

              <div class="pt-4 border-t border-[var(--le-border)]">
                <button type="submit" class="btn-primary" [disabled]="trackForm.invalid || isSubmitting">
                  <ng-container *ngIf="isSubmitting">
                    <span class="spinner-small"></span> Saving...
                  </ng-container>
                  <ng-container *ngIf="!isSubmitting">
                    <span class="material-symbols-outlined text-[18px]">
                      {{ isEditMode ? 'save' : 'rocket_launch' }}
                    </span>
                    {{ isEditMode ? 'Update Track' : 'Create Track' }}
                  </ng-container>
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
