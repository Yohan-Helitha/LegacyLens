# CI — Mobile App (React Native / Expo)
# Runs on every push/PR targeting main or dev that touches mobile-app/** files.
# Stages: lint (ESLint) → type-check (tsc) → test (Jest)

name: Mobile App CI

on:
  push:
    branches: [main, dev]
    paths:
      - "mobile-app/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile-app/**"

jobs:
  lint-typecheck-test:
    name: Lint, Type-check & Test (Node 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run type-check

      - name: Run tests (Jest)
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile-app/coverage/
